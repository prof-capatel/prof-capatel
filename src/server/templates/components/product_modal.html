<!-- Deep-Dive Product & Edition Tiers Comparison Modal -->
<div id="productDetailModal" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(5px); z-index: 99999; align-items: center; justify-content: center; padding: 16px;">
    <div class="card" style="max-width: 920px; width: 100%; max-height: 92vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25); border: 1.5px solid var(--border-subtle); border-radius: var(--radius-lg); background: #FFFFFF; display: flex; flex-direction: column;">
        <!-- Modal Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-page);">
            <div style="display: flex; align-items: center; gap: 14px;">
                <div id="modalProductIconContainer" style="width: 44px; height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 20px; background: rgba(234, 88, 12, 0.12); color: var(--accent-primary);">
                    <i id="modalProductIcon" class="fa-solid fa-face-smile"></i>
                </div>
                <div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <h3 id="modalProductTitle" style="font-size: 18px; font-weight: 800; color: var(--text-heading); margin: 0;">
                            Face based Attendance System
                        </h3>
                        <span class="badge badge-sky" id="modalProductBadge" style="font-size: 10px; font-weight: 700;">Full Edition Matrix</span>
                    </div>
                    <p id="modalProductSubtitle" style="font-size: 12.5px; color: var(--text-muted); margin: 3px 0 0 0;">
                        Detailed technical specifications and capability matrix across Basic, Smart, and Pro editions.
                    </p>
                </div>
            </div>
            <button type="button" onclick="closeProductModal()" style="background: none; border: none; font-size: 20px; color: var(--text-muted); cursor: pointer; padding: 6px 10px; border-radius: var(--radius-xs); line-height: 1;" aria-label="Close Modal">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Modal Body: Comparative Table -->
        <div style="padding: 24px; overflow-x: auto;">
            <!-- Comparison Table Container -->
            <div id="modalComparisonTableContainer">
                <!-- Dynamically populated by landing.js -->
            </div>
        </div>

        <!-- Modal Footer -->
        <div style="padding: 16px 24px; border-top: 1px solid var(--border-subtle); background: var(--bg-page); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <div style="font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-shield-halved" style="color: var(--accent-emerald);"></i>
                <span>All editions include cloud security, automatic updates &amp; multi-tenant isolation.</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="button" class="btn btn-secondary" onclick="closeProductModal()" style="font-size: 12.5px; padding: 8px 16px;">
                    Close
                </button>
                <button type="button" class="btn btn-primary" onclick="closeProductModal(); openFreeDemoModal();" style="font-size: 12.5px; padding: 8px 18px; font-weight: 700;">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Launch 7-Day Free Demo
                </button>
            </div>
        </div>
    </div>
</div>
