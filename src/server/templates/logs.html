{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3>
            <i class="fa-solid fa-clock-rotate-left" style="color: var(--accent-primary);"></i>
            <span>Attendance Logs Audit Trail</span>
        </h3>
        <div style="display: flex; gap: 10px;">
            <button onclick="exportData('csv')" class="btn btn-secondary">
                <i class="fa-solid fa-file-csv" style="color: var(--accent-emerald);"></i>
                <span>Export CSV</span>
            </button>
            <button onclick="exportData('xlsx')" class="btn btn-secondary">
                <i class="fa-solid fa-file-excel" style="color: var(--accent-cyan);"></i>
                <span>Export Excel</span>
            </button>
        </div>
    </div>
    <div class="card-body">
        <!-- Filter Controls -->
        <div style="display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; align-items: flex-end; background: var(--bg-subtle); padding: 18px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
            <div style="flex: 1; min-width: 180px;">
                <label class="form-label">Date Filter</label>
                <input type="date" id="filterDate" class="form-control" value="{{ today_str }}">
            </div>
            <div style="flex: 1; min-width: 180px;">
                <label class="form-label">Search Roll Number</label>
                <input type="text" id="filterRoll" class="form-control" placeholder="e.g. CS2026">
            </div>
            <div>
                <button id="btnApplyFilter" class="btn btn-primary" style="padding: 10px 20px;">
                    <i class="fa-solid fa-filter"></i> Apply Filter
                </button>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="table-container">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student</th>
                        <th>Roll Number</th>
                        <th>Department</th>
                        <th>Node Ingested</th>
                        <th>Timestamp</th>
                        <th>Confidence</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody">
                    <!-- Populated dynamically via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", () => {
        applyLogFilters();
    });
</script>
{% endblock %}
